server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  application:
    name: campusskills
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/campusskills;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    database-platform: ${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

campusskills:
  admin:
    email: ${CAMPUS_ADMIN_EMAIL:Campus_admin@campus.edu.in}
    password: ${CAMPUS_ADMIN_PASSWORD:}
  backup:
    directory: ${CAMPUSSKILLS_BACKUP_DIRECTORY:./backups}
    retention-count: ${CAMPUSSKILLS_BACKUP_RETENTION:7}
    schedule: ${CAMPUSSKILLS_BACKUP_SCHEDULE:0 0 2 * * *}
  reminders:
    schedule: ${CAMPUSSKILLS_REMINDER_SCHEDULE:0 * * * * *}
  password-reset:
    frontend-base-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:CampusSkillsSuperSecretKeyForJwtSigningMustBeVeryLong20261103!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
