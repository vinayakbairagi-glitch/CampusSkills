spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DB:campusskills}}?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME:${MYSQLUSER:${MYSQL_USER:}}}
    password: ${DATABASE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
  h2:
    console:
      enabled: false

campusskills:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  admin:
    email: ${CAMPUS_ADMIN_EMAIL:Campus_admin@campus.edu.in}
    password: ${CAMPUS_ADMIN_PASSWORD}
